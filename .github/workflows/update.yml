name: Cập nhật dữ liệu vĩ mô
on:
  schedule:
    - cron: "0 23 * * *"   # 6:00 sáng hằng ngày giờ Việt Nam
  workflow_dispatch:          # cho phép bấm chạy tay
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_macro.py
      - name: Commit nếu có dữ liệu mới
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add docs/data/macro.json
          git diff --cached --quiet || (git commit -m "Cập nhật dữ liệu $(date -u +%F)" && git pull --rebase -q && git push)
